# fly.toml — Jeumpa LLM v1.0.0 Deployment
# https://fly.io/docs/reference/configuration/

app = "jeumpa-llm"
primary_region = "sgp"

[build]
  Dockerfile = "Dockerfile"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "3333"
  NODE_ENV = "production"
  HEALTH_CHECK_INTERVAL_MS = "60000"
  FRAGILE_CHECK_INTERVAL_MS = "300000"

[mounts]
  source = "jeumpa_data"
  destination = "/data"

[metrics]
  port = 9090
  path = "/metrics"
